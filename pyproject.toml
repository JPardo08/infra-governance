[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pardo-governance"
version = "1.0.0"
description = "Runtime-independent PARDO ProjectGovernance evaluator"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pardo_governance = ["*.schema.json"]
